<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Antrian — CicilApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #1f3b2c; --board-dark: #172e22; --chalk: #f2f0e6;
    --chalk-dim: #c9d4c9; --yellow: #e8b923; --rose: #c97b84; --frame: #4a3423;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh; background: var(--frame);
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 40px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; font-family: 'Space Mono', monospace; color: var(--chalk);
  }
  .board {
    width: 100%; max-width: 460px; background: var(--board);
    background-image: radial-gradient(ellipse at top left, rgba(255,255,255,0.04), transparent 60%);
    border: 10px solid var(--frame); border-radius: 4px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.35);
    padding: 32px 24px 28px; position: relative;
  }
  .board::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px dashed rgba(242,240,230,0.15); pointer-events: none;
  }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--yellow); text-align: center; margin-bottom: 6px; }
  h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 42px; text-align: center; color: var(--chalk); line-height: 1; margin-bottom: 4px; transform: rotate(-1deg); }
  .sub { text-align: center; font-size: 12px; color: var(--chalk-dim); margin-bottom: 28px; }
  .stub { display: flex; align-items: center; gap: 14px; background: var(--board-dark); border: 1px dashed rgba(242,240,230,0.25); border-radius: 6px; padding: 14px 16px; margin-bottom: 26px; }
  .stub .no { font-family: 'Caveat', cursive; font-size: 30px; color: var(--yellow); border: 2px solid var(--yellow); border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transform: rotate(-4deg); }
  .stub .text { font-size: 12px; line-height: 1.5; color: var(--chalk-dim); }
  .stub .text b { color: var(--chalk); font-size: 13px; }
  .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--chalk-dim); text-align: center; margin-bottom: 10px; }
  .timer { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .unit { background: var(--board-dark); border: 1px solid rgba(242,240,230,0.2); border-radius: 6px; width: 68px; padding: 10px 0 8px; text-align: center; }
  .unit .val { font-size: 26px; font-weight: 700; color: var(--chalk); text-shadow: 0 0 8px rgba(232,185,35,0.25); }
  .unit .u { font-size: 9px; letter-spacing: 1.5px; color: var(--rose); text-transform: uppercase; margin-top: 2px; }
  .status-line { text-align: center; font-size: 13px; color: var(--chalk); background: rgba(232,185,35,0.1); border-left: 3px solid var(--yellow); padding: 10px 14px; border-radius: 2px; margin-bottom: 14px; }
  .status-line b { color: var(--yellow); }
  .foot { font-size: 11px; color: var(--chalk-dim); text-align: center; line-height: 1.6; }
  .loading { text-align: center; font-size: 12px; color: var(--chalk-dim); padding: 20px 0; }
  @media (max-width: 360px) { .unit { width: 58px; } .unit .val { font-size: 21px; } }
</style>
</head>
<body>

<div class="board">
  <div class="eyebrow">Papan Antrian</div>
  <h1>Status Slot CicilApp</h1>
  <div class="sub">Cek ketersediaan slot pengerjaan sebelum antre</div>

  <div id="content">
    <div class="loading">Memuat status…</div>
  </div>

  <div class="foot">Data diperbarui langsung oleh admin</div>
</div>

<script>
  async function loadStatus() {
    const content = document.getElementById('content');
    try {
      const res = await fetch('./status.json?t=' + Date.now());
      if (!res.ok) throw new Error('gagal ambil data');
      const data = await res.json();
      render(data);
    } catch (e) {
      content.innerHTML = '<div class="loading">Status belum tersedia, coba refresh sebentar lagi.</div>';
    }
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function render(data) {
    const content = document.getElementById('content');
    const total = data.slotTotal ?? 2;

    if (!data.adaKlienAktif) {
      content.innerHTML = `
        <div class="stub">
          <div class="no">0/${total}</div>
          <div class="text"><b>Belum ada antrian saat ini</b><br>Slot kosong, bisa langsung mulai</div>
        </div>
        <div class="status-line">Slot lagi kosong — langsung chat kami, bisa mulai kapan aja 🚀</div>
      `;
      return;
    }

    const filled = data.slotFilled ?? 0;
    const msg = filled >= total ? 'Slot penuh untuk periode ini' : (total - filled) + ' slot masih tersedia sekarang';
    const line = filled >= total
      ? 'Mau antre di slot berikutnya? Langsung chat kami aja, nanti dicatat manual.'
      : 'Slot masih ada — langsung chat kami untuk mulai proyek kamu 🚀';

    content.innerHTML = `
      <div class="stub">
        <div class="no">${filled}/${total}</div>
        <div class="text"><b>${msg}</b><br>Slot dibuka kembali otomatis setelah hitung mundur selesai</div>
      </div>
      <div class="label">Slot berikutnya terbuka dalam</div>
      <div class="timer">
        <div class="unit"><div class="val" id="dd">00</div><div class="u">Hari</div></div>
        <div class="unit"><div class="val" id="hh">00</div><div class="u">Jam</div></div>
        <div class="unit"><div class="val" id="mm">00</div><div class="u">Menit</div></div>
        <div class="unit"><div class="val" id="ss">00</div><div class="u">Detik</div></div>
      </div>
      <div class="status-line" id="statusLine">${line}</div>
    `;

    const deadline = new Date(data.deadline);
    function tick() {
      const diff = deadline - new Date();
      if (diff <= 0) {
        ['dd','hh','mm','ss'].forEach(id => document.getElementById(id).textContent = '00');
        document.getElementById('statusLine').innerHTML = 'Slot baru sudah <b>terbuka</b> — chat kami untuk ambil slot ini.';
        return;
      }
      document.getElementById('dd').textContent = pad(Math.floor(diff / 86400000));
      document.getElementById('hh').textContent = pad(Math.floor(diff / 3600000) % 24);
      document.getElementById('mm').textContent = pad(Math.floor(diff / 60000) % 60);
      document.getElementById('ss').textContent = pad(Math.floor(diff / 1000) % 60);
    }
    tick();
    setInterval(tick, 1000);
  }

  loadStatus();
</script>

</body>
</html>
